name: Deploy Earthlight to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build and browser-test dependencies
        run: npm install --no-audit --no-fund

      - name: Run astronomy and playback tests
        run: npm test

      - name: Validate JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/solar.js
          node --check src/preview.js
          node --check scripts/build.mjs

      - name: Build self-hosted site
        run: npm run build

      - name: Browser smoke test (real button interaction)
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory _site > /tmp/earthlight-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
