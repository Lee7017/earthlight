name: Deploy Earthlight to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run astronomy and playback tests
        run: node --test src/*.test.js

      - name: Validate browser JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/solar.js
          node --check src/preview.js

      - name: Browser smoke test (real button interaction)
        run: |
          npm install --no-save puppeteer-core@24.30.0
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/earthlight-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html favicon.svg _site/
          cp -R src _site/
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
